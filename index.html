<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="An editable one-page daily time block planner. Compare your routine with your adjusted schedule and print on one letter-sized sheet.">
<title>Daily Time Block Schedule</title>
<style>
:root{--ink:#171717;--muted:#666;--line:#bfc5c1;--accent:#2e5b4d;--paper:#fff;color-scheme:light}
*{box-sizing:border-box}
html{background:#ecece8;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0}
button,input,textarea{font:inherit}
.toolbar{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.97);border-bottom:1px solid #cfcfcf}
.toolbar-inner{max-width:900px;margin:auto;padding:12px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;margin-right:auto}
button{cursor:pointer;border:1px solid #bec5c0;border-radius:999px;background:white;padding:8px 14px;font-weight:650}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:24px 12px 48px}
.sheet{width:min(8.5in,100%);min-height:11in;background:var(--paper);padding:.45in;margin:auto;box-shadow:0 5px 24px #00000018;border-radius:3px}
.sheet-head{border-bottom:2px solid var(--ink);display:flex;align-items:end;justify-content:space-between;gap:14px;padding-bottom:12px;margin-bottom:12px}
h1{font-size:23px;line-height:1.15;margin:0;font-weight:800}
.subtitle{font-size:11px;color:var(--muted);margin:5px 0 0}
.date-field{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.date-field input{width:165px;border:1px solid var(--line);border-radius:5px;padding:6px;background:#fff;color:var(--ink)}
table{border-collapse:collapse;width:100%;table-layout:fixed;border:1px solid var(--line)}
col.time{width:13%}col.entry{width:43.5%}
th{height:36px;text-align:left;background:#f5f5f3;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
th,td{border:1px solid var(--line);padding:0 9px}
td{height:49px;vertical-align:middle}
td.time-cell{font-size:11px;font-weight:750;white-space:nowrap;background:#fafaf9}
td textarea{border:0;outline:none;resize:none;display:block;width:100%;height:45px;min-height:45px;line-height:20px;padding:2px 0;background:transparent;color:var(--ink);font-size:12px;overflow:auto}
td textarea:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
.sheet-footer{margin-top:8px;font-size:9px;color:var(--muted);display:flex;justify-content:space-between}
@media(max-width:640px){.sheet{padding:16px;min-height:0}.sheet-head{align-items:flex-start;flex-direction:column}h1{font-size:20px}.date-field input{width:180px}col.time{width:20%}col.entry{width:40%}th,td{padding:0 5px}td.time-cell{font-size:10px}td textarea{font-size:12px}}
@page{size:letter portrait;margin:.35in}
@media print{
 html,body{background:white!important;margin:0!important;padding:0!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .toolbar{display:none!important}
 main{padding:0!important}
 .sheet{width:100%!important;min-height:0!important;height:auto!important;margin:0!important;padding:0!important;box-shadow:none!important;border-radius:0!important}
 .sheet-head{padding-bottom:8px;margin-bottom:9px}
 h1{font-size:21px}
 .subtitle{font-size:10px}
 .date-field input{border:0;border-bottom:1px solid #888;border-radius:0;padding:3px 0;width:145px;font-size:11px}
 table{break-inside:avoid;page-break-inside:avoid}
 th{height:30px;font-size:10px}
 td{height:47px}
 td textarea{height:43px;min-height:43px;overflow:hidden;resize:none;font-size:11px;line-height:18px}
 tr{break-inside:avoid;page-break-inside:avoid}
 .sheet-footer{font-size:8px}
}
</style>
</head>
<body>
<header class="toolbar"><div class="toolbar-inner">
 <span class="brand">Daily Time Block Planner</span>
 <button type="button" class="primary" id="printBtn">Print / Save PDF</button>
 <button type="button" id="clearBtn">Clear entries</button>
</div></header>
<main><article class="sheet" aria-label="Daily time block schedule">
 <div class="sheet-head"><div><h1>DAILY TIME BLOCK SCHEDULE</h1><p class="subtitle">Plan your routine. Record adjustments as the day unfolds.</p></div>
 <label class="date-field" for="plannerDate">Date<input type="date" id="plannerDate"></label></div>
 <table aria-label="Hourly schedule from 6 AM to 10 PM">
  <colgroup><col class="time"><col class="entry"><col class="entry"></colgroup>
  <thead><tr><th scope="col">Time</th><th scope="col">Routine</th><th scope="col">Adjusted</th></tr></thead>
  <tbody id="scheduleRows"></tbody>
 </table>
 <div class="sheet-footer"><span>Daily Time Block Planner</span><span>One-day / one-page worksheet</span></div>
</article></main>
<script>
(function(){
 const tbody=document.getElementById('scheduleRows');
 function clock(hour){return String(hour%12||12)+':00 '+(hour<12?'AM':'PM')}
 for(let hour=6;hour<=22;hour++){
  const tr=document.createElement('tr');
  const time=document.createElement('td');time.className='time-cell';time.textContent=clock(hour);tr.appendChild(time);
  for(const type of ['routine','adjusted']){
   const td=document.createElement('td');
   const field=document.createElement('textarea');field.rows=2;field.dataset.key=type+'-'+hour;
   field.setAttribute('aria-label',type+' at '+clock(hour));
   td.appendChild(field);tr.appendChild(td);
  }
  tbody.appendChild(tr);
 }
 const date=document.getElementById('plannerDate');
 const fields=[...document.querySelectorAll('textarea')];
 try{
  date.value=localStorage.getItem('timeblock-date')||new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  date.addEventListener('change',()=>localStorage.setItem('timeblock-date',date.value));
  fields.forEach(el=>{el.value=localStorage.getItem('timeblock-'+el.dataset.key)||'';el.addEventListener('input',()=>localStorage.setItem('timeblock-'+el.dataset.key,el.value))});
 }catch(e){date.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}
 document.getElementById('printBtn').addEventListener('click',()=>window.print());
 document.getElementById('clearBtn').addEventListener('click',()=>{
  if(!confirm('Clear all Routine and Adjusted entries?'))return;
  fields.forEach(el=>{el.value='';try{localStorage.removeItem('timeblock-'+el.dataset.key)}catch(e){}});
 });
})();
</script>
</body>
</html>
