<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="An editable one-page daily time block planner. Plan tasks and events with a priority column and hourly boundary markers, then print on one letter-sized sheet.">
<title>Daily Time Block Schedule</title>
<style>
:root{--ink:#171717;--muted:#666;--line:#bfc5c1;--accent:#2e5b4d;--paper:#fff;color-scheme:light}
*{box-sizing:border-box}
html{background:#ecece8;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0}
button,input,textarea{font:inherit}
.toolbar{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.97);border-bottom:1px solid #cfcfcf}
.toolbar-inner{max-width:900px;margin:auto;padding:12px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;margin-right:auto}
button{cursor:pointer;border:1px solid #bec5c0;border-radius:999px;background:white;padding:8px 14px;font-weight:650}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:24px 12px 48px}
.sheet{width:min(8.5in,100%);min-height:11in;background:var(--paper);padding:.45in;margin:auto;box-shadow:0 5px 24px #00000018;border-radius:3px}
.sheet-head{border-bottom:2px solid var(--ink);display:flex;align-items:start;justify-content:space-between;gap:14px;padding-bottom:9px;margin-bottom:10px}.header-meta{margin-left:auto;display:flex;align-items:start;gap:12px;justify-content:flex-end;flex-shrink:0}.planner-qr{display:flex;flex-direction:column;align-items:center;gap:3px;width:92px;margin-left:auto}.planner-qr img{display:block;width:80px;height:80px;object-fit:contain}.planner-qr span{text-align:center;font-size:9px;line-height:1.15;font-weight:700;white-space:nowrap}
h1{font-size:23px;line-height:1.15;margin:0;font-weight:800}
.subtitle{font-size:11px;color:var(--muted);margin:5px 0 0}
.date-field{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.date-field input{width:165px;border:1px solid var(--line);border-radius:5px;padding:6px;background:#fff;color:var(--ink)}.date-field input:not(.has-date){color:#999}.date-field input:not(.has-date)::-webkit-datetime-edit{color:#999}
table{border-collapse:collapse;width:100%;table-layout:fixed;border:1px solid var(--line)}
col.priority{width:11%}col.tasks{width:39%}col.time{width:12%}col.events{width:38%}
th{height:36px;text-align:left;background:#f5f5f3;text-transform:uppercase;font-size:11px;letter-spacing:.06em;white-space:nowrap} .move-col{border:0;background:transparent;padding:1px 1px;margin-left:1px;font-size:9px;border-radius:4px;color:var(--accent);vertical-align:middle} .move-col:hover{background:#e2eae4} .time-title-toggle{border:0;background:transparent;padding:3px 2px;margin:0;font-size:11px;letter-spacing:.06em;font-weight:700;color:var(--ink);border-radius:3px}.time-title-toggle:hover{background:#e2eae4;text-decoration:underline}  .column-heading{display:inline-block} .priority-head .column-heading{font-size:8px} .priority-head .move-col{margin:0;padding:0 1px;font-size:8px} .format-hint{font-size:10px;color:var(--muted)}
th,td{border:1px solid var(--line);padding:0 7px}
td{height:49px;vertical-align:middle}
td.time-cell{position:relative;font-size:10px;font-weight:750;white-space:nowrap;background:#fafaf9;overflow:visible;text-align:center;padding:0 1px} .time-marker{position:absolute;top:-7px;left:0;right:0;z-index:1;display:block;background:#fafaf9;line-height:14px;font-size:9px;width:max-content;max-width:100%;margin:auto;padding:0 1px} .time-marker.end{top:auto;bottom:-7px} th.priority-head{font-size:9px;letter-spacing:0;text-align:center;padding:0 1px} td.priority-cell textarea{text-align:center}
td textarea{border:0;outline:none;resize:none;display:block;width:100%;height:45px;min-height:45px;line-height:20px;padding:2px 0;background:transparent;color:var(--ink);font-size:12px;overflow:auto}
td textarea:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}

@media(max-width:640px){.sheet{padding:16px;min-height:0}.sheet-head{align-items:flex-start;flex-direction:column}.header-meta{width:100%;margin-left:0;justify-content:space-between}.planner-qr{margin-left:auto}h1{font-size:20px}.date-field input{width:180px}col.priority{width:12%}col.tasks{width:38%}col.time{width:13%}col.events{width:37%}th,td{padding:0 5px}td.time-cell{font-size:9px}.time-marker{font-size:8px}td textarea{font-size:12px}}
@page{size:letter portrait;margin:.35in}
@media print{
 html,body{background:white!important;margin:0!important;padding:0!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .toolbar,.move-col,.format-hint,.screen-only{display:none!important}.time-title-toggle{color:#000!important;text-decoration:none!important;pointer-events:none!important}
 main{padding:0!important}
 .sheet{width:100%!important;min-height:0!important;height:auto!important;margin:0!important;padding:0!important;box-shadow:none!important;border-radius:0!important}
 .sheet-head{padding-bottom:6px;margin-bottom:7px;min-height:96px}.header-meta{margin-left:auto;justify-content:flex-end}.planner-qr{margin-left:auto;align-items:center}.planner-qr img{width:76px;height:76px}.planner-qr span{font-size:8px}
 h1{font-size:21px}
 .subtitle{font-size:10px}
 .date-field input{border:0;border-bottom:1px solid #888;border-radius:0;padding:3px 0;width:145px;font-size:11px}.date-field input:not(.has-date){color:transparent!important}.date-field input:not(.has-date)::-webkit-datetime-edit{color:transparent!important}.date-field input:not(.has-date)::-webkit-calendar-picker-indicator{visibility:hidden!important}
 table{break-inside:avoid;page-break-inside:avoid}
 th{height:30px;font-size:10px}
 td{height:47px}.time-marker{font-size:8px}
 td textarea{height:43px;min-height:43px;overflow:hidden;resize:none;font-size:11px;line-height:18px}
 tr{break-inside:avoid;page-break-inside:avoid}
 
}
</style>
</head>
<body>
<header class="toolbar"><div class="toolbar-inner">
 <span class="brand">Daily Time Block Planner</span>
 <button type="button" class="primary" id="printBtn">Print / Save PDF</button>
 <button type="button" id="clearBtn">Clear entries</button>
</div></header>
<main><article class="sheet" aria-label="Daily time block schedule">
 <div class="sheet-head"><div><h1>DAILY TIME BLOCK SCHEDULE</h1><p class="subtitle screen-only">Use the arrows beside a column heading to move it left or right.</p></div>
 <div class="header-meta"><label class="date-field" for="plannerDate">Date<input type="date" id="plannerDate"></label><div class="planner-qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&amp;data=https%3A%2F%2Frobert-z-lehr.github.io%2FTime-block-planner%2F" alt="QR code linking to Time Block Planner" width="80" height="80"><span>Time Block Planner</span></div></div></div>
 <table aria-label="Hourly schedule from 6 AM to 10 PM">
  <colgroup id="columnWidths"><col class="priority"><col class="tasks"><col class="events"><col class="time"></colgroup>
  <thead><tr id="columnHeaders"></tr></thead>
  <tbody id="scheduleRows"></tbody>
 </table>
 </article></main>
<script>
(function(){
 const tbody=document.getElementById('scheduleRows');
 const headers=document.getElementById('columnHeaders');
 const widths=document.getElementById('columnWidths');
 const valid=['priority','tasks','events','time'];
 let order=[...valid];
 let mode='24';
 try{
  const saved=JSON.parse(localStorage.getItem('timeblock-column-order')||'null');
  if(Array.isArray(saved)&&saved.length===4&&valid.every(v=>saved.includes(v)))order=saved;
  if(localStorage.getItem('timeblock-time-format')==='12')mode='12';
 }catch(e){}
 function clock(hour){return mode==='24'?String(hour):String(hour%12||12)+' '+(hour<12?'AM':'PM')}
 function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
 function addField(tr,type,hour){
  const td=document.createElement('td');td.dataset.column=type;if(type==='priority')td.className='priority-cell';
  const field=document.createElement('textarea');field.rows=2;field.dataset.key=type+'-'+hour;
  field.setAttribute('aria-label',type+' for hour '+hour);
  td.appendChild(field);tr.appendChild(td);
 }
 for(let hour=6;hour<22;hour++){
  const tr=document.createElement('tr');
  for(const type of ['priority','tasks','events'])addField(tr,type,hour);
  const time=document.createElement('td');time.dataset.column='time';time.className='time-cell';
  const tick=document.createElement('span');tick.className='time-marker';tick.dataset.hour=String(hour);time.appendChild(tick);
  if(hour===21){const last=document.createElement('span');last.className='time-marker end';last.dataset.hour='22';time.appendChild(last)}
  tr.appendChild(time);tbody.appendChild(tr);
 }
 function renderColumns(){
  headers.replaceChildren();
  widths.replaceChildren();
  order.forEach(type=>{
   const col=document.createElement('col');col.className=type;widths.appendChild(col);
   const th=document.createElement('th');th.scope='col';th.dataset.column=type;
   if(type==='priority')th.className='priority-head';
   if(type==='time'){
    const toggle=document.createElement('button');toggle.type='button';toggle.id='timeFormatBtn';toggle.className='time-title-toggle';
    toggle.textContent='TIME';toggle.title='Click TIME to switch 12-hour / 24-hour labels';
    toggle.setAttribute('aria-label','TIME: switch between 12-hour and 24-hour format');
    toggle.addEventListener('click',()=>{mode=mode==='24'?'12':'24';store('timeblock-time-format',mode);renderClock()});
    th.appendChild(toggle);
   }else{
    const label=document.createElement('span');label.className='column-heading';label.textContent=type[0].toUpperCase()+type.slice(1);th.appendChild(label);
   }
   for(const direction of [-1,1]){
    const move=document.createElement('button');move.type='button';move.className='move-col';
    move.textContent=direction<0?'←':'→';
    const side=direction<0?'left':'right';
    move.title='Move '+type+' one column '+side+' (wrap around)';
    move.setAttribute('aria-label','Move '+type+' one column '+side);
    move.addEventListener('click',()=>{
     const index=order.indexOf(type),next=(index+direction+order.length)%order.length;
     [order[index],order[next]]=[order[next],order[index]];
     store('timeblock-column-order',JSON.stringify(order));renderColumns();
    });
    th.appendChild(move);
   }
   headers.appendChild(th);
  });
  for(const tr of tbody.rows){const cells=Object.fromEntries([...tr.cells].map(td=>[td.dataset.column,td]));order.forEach(type=>tr.appendChild(cells[type]))}
  renderClock();
 }
 function renderClock(){
  document.querySelectorAll('.time-marker').forEach(el=>{el.textContent=clock(Number(el.dataset.hour))});
  const btn=document.getElementById('timeFormatBtn');
  if(!btn)return;
  btn.textContent='TIME';
  btn.setAttribute('aria-pressed',String(mode==='12'));
 }
 renderColumns();renderClock();
 const date=document.getElementById('plannerDate');
 const fields=[...document.querySelectorAll('textarea')];
 // Every page load starts with empty planner cells. No old entries are restored.
 fields.forEach(el=>{el.value='';});
 // No automatic date: only an explicitly selected date is printed.
 date.value='';
 function updateDateAppearance(){date.classList.toggle('has-date',Boolean(date.value))}
 date.addEventListener('change',updateDateAppearance);
 date.addEventListener('input',updateDateAppearance);
 updateDateAppearance();
 document.getElementById('printBtn').addEventListener('click',()=>window.print());
 document.getElementById('clearBtn').addEventListener('click',()=>{
  if(!confirm('Clear all Priority, Tasks, and Events entries?'))return;
  fields.forEach(el=>{el.value='';});
 });
})();
</script>
</body>
</html>
